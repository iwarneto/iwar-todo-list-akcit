[project]
name = "iwar-todo-list-akcit"
version = "1.0.1"
description = "Micro-API de gerenciamento de tarefas (To-Do List) com FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
